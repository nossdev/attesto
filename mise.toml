# Toolchain pins + task runner for Attesto.
# Run `mise install` after cloning to install exact versions below.
# Per-machine overrides and secrets go in .mise.local.toml (gitignored).

[tools]
deno     = "2.7.12"
flyctl   = "latest"
# Node + pnpm power the docs/ VitePress site (separate from the Deno service).
node     = "20"
pnpm     = "9"
# postgres client is optional — uncomment if you want `psql` from mise
# (the DB itself runs in docker-compose, so the client is only for ad-hoc queries):
# postgres = "16"

[env]
# Load secrets + per-machine env from gitignored file.
# CI has no .mise.local.toml; it uses GitHub Actions secrets instead.
_.file = [".mise.local.toml"]

# Non-secret defaults. Override in .mise.local.toml if needed.
PORT = "8080"
LOG_LEVEL = "info"
NODE_ENV = "development"

# ============================================================
# LIFECYCLE TASKS — thin wrappers around deno tasks.
# deno.json is the source of truth for dev/test/lint commands;
# mise tasks exist for tab-completion and cross-tool orchestration.
# ============================================================

[tasks.dev]
description = "Run Attesto in watch mode against docker-compose Postgres"
depends = ["db:up"]
run = "deno task dev"

[tasks.start]
description = "Run Attesto in production mode (no watch)"
run = "deno task start"

[tasks.test]
description = "Run all tests (unit + integration)"
depends = ["db:up"]
run = "deno task test"

[tasks.lint]
description = "Lint + format-check + typecheck"
run = '''
deno task lint
deno task fmt:check
deno task check
'''

[tasks.fmt]
description = "Auto-format all source files"
run = "deno task fmt"

[tasks.check]
description = "Typecheck without running"
run = "deno task check"

# ============================================================
# DATABASE TASKS
# ============================================================

[tasks."db:up"]
description = "Start Postgres via docker-compose"
run = "docker compose up -d db"

[tasks."db:down"]
description = "Stop Postgres container (keeps volume)"
run = "docker compose stop db"

[tasks."db:reset"]
description = "Drop volume, restart Postgres, re-run all migrations"
run = '''
docker compose down -v
docker compose up -d db
until docker compose exec -T db pg_isready -U attesto > /dev/null 2>&1; do sleep 1; done
deno task db:migrate
'''

[tasks."db:migrate"]
description = "Run pending Drizzle migrations"
depends = ["db:up"]
run = "deno task db:migrate"

[tasks."db:generate"]
description = "Generate SQL migration from schema changes"
run = "deno task db:generate"

[tasks."db:psql"]
description = "Open psql shell against the local dev database"
run = "docker compose exec db psql -U attesto -d attesto"

# ============================================================
# ADMIN CLI
# ============================================================

[tasks.cli]
description = "Invoke attesto-admin CLI (pass args after --, e.g. mise run cli -- tenant:list)"
run = "deno task cli"

# ============================================================
# TENANT OPS — thin wrappers over the deployed admin CLI.
# Each task delegates to scripts/fly-attesto.sh which handles target
# validation (staging/prod, no typos), Fly app-name resolution, and
# safe arg escaping (printf %q) across the local-shell → fly-ssh →
# remote-sh boundary. The binary on Fly already has every admin
# subcommand we ship; these tasks just shorten the invocation.
#
# Credential-setting commands (apple:set-credentials, google:set-credentials)
# are intentionally NOT wrapped — their --key-path / --service-account-path
# args read files via Deno.readTextFile on the binary's filesystem, which is
# the Fly container, not your laptop. Onboarding still uses the local CLI
# flow per docs/self-host/onboarding.md.

[tasks."t:ls"]
description = "List all tenants on the target app"
usage = '''
flag "--target <env>" help="staging or prod (default: staging)"
'''
run = '''scripts/fly-attesto.sh "${usage_target:-staging}" tenant:list'''

[tasks."t:new"]
description = "Create a new tenant"
usage = '''
flag "--name <name>" help="Tenant display name (required)"
flag "--target <env>" help="staging or prod (default: staging)"
'''
run = '''
[ -n "${usage_name:-}" ] || { echo "error: --name is required" >&2; exit 2; }
scripts/fly-attesto.sh "${usage_target:-staging}" tenant:create --name "${usage_name}"
'''

[tasks."t:deactivate"]
description = "Deactivate a tenant"
usage = '''
arg "tenant_id" help="Tenant ID (tenant_01HXY...)"
flag "--target <env>" help="staging or prod (default: staging)"
'''
run = '''scripts/fly-attesto.sh "${usage_target:-staging}" tenant:deactivate "${usage_tenant_id}"'''

[tasks."t:key:ls"]
description = "List API keys for a tenant"
usage = '''
arg "tenant_id" help="Tenant ID (tenant_01HXY...)"
flag "--target <env>" help="staging or prod (default: staging)"
'''
run = '''scripts/fly-attesto.sh "${usage_target:-staging}" key:list "${usage_tenant_id}"'''

[tasks."t:key:new"]
description = "Mint a new API key for a tenant (output is single-shot — save it)"
usage = '''
arg "tenant_id" help="Tenant ID (tenant_01HXY...)"
flag "--name <label>" help="Optional human label for the key"
flag "--env <env>" help="live or test (default: live)"
flag "--target <env>" help="staging or prod (default: staging)"
'''
run = '''
ARGS=("${usage_tenant_id}" --env "${usage_env:-live}")
[ -n "${usage_name:-}" ] && ARGS+=(--name "${usage_name}")
scripts/fly-attesto.sh "${usage_target:-staging}" key:create "${ARGS[@]}"
'''

[tasks."t:key:revoke"]
description = "Revoke an API key by id"
usage = '''
arg "key_id" help="API key ID (key_01HXY...)"
flag "--target <env>" help="staging or prod (default: staging)"
'''
run = '''scripts/fly-attesto.sh "${usage_target:-staging}" key:revoke "${usage_key_id}"'''

[tasks."t:apple:get"]
description = "Show Apple credentials metadata for a tenant (no .p8 disclosure)"
usage = '''
arg "tenant_id" help="Tenant ID (tenant_01HXY...)"
flag "--target <env>" help="staging or prod (default: staging)"
'''
run = '''scripts/fly-attesto.sh "${usage_target:-staging}" apple:get-credentials "${usage_tenant_id}"'''

[tasks."t:apple:test"]
description = "Ask Apple to dispatch a synthetic V2 webhook to the tenant's configured URL"
usage = '''
arg "tenant_id" help="Tenant ID (tenant_01HXY...)"
flag "--env <env>" help="sandbox or production (default: sandbox)"
flag "--target <env>" help="staging or prod (default: staging)"
'''
run = '''scripts/fly-attesto.sh "${usage_target:-staging}" apple:request-test-notification "${usage_tenant_id}" --env "${usage_env:-sandbox}"'''

[tasks."t:wh:get"]
description = "Show webhook (outbound) config for a tenant"
usage = '''
arg "tenant_id" help="Tenant ID (tenant_01HXY...)"
flag "--target <env>" help="staging or prod (default: staging)"
'''
run = '''scripts/fly-attesto.sh "${usage_target:-staging}" webhook:get "${usage_tenant_id}"'''

[tasks."t:wh:set"]
description = "Set/update outbound webhook config for a tenant"
usage = '''
arg "tenant_id" help="Tenant ID (tenant_01HXY...)"
flag "--callback-url <url>" help="Tenant's callback URL (https://...) (required)"
flag "--secret <base64>" help="HMAC signing secret (base64, ≥32 bytes) (required)"
flag "--target <env>" help="staging or prod (default: staging)"
'''
run = '''
[ -n "${usage_callback_url:-}" ] || { echo "error: --callback-url is required" >&2; exit 2; }
[ -n "${usage_secret:-}" ] || { echo "error: --secret is required" >&2; exit 2; }
scripts/fly-attesto.sh "${usage_target:-staging}" webhook:set-config "${usage_tenant_id}" --callback-url "${usage_callback_url}" --secret "${usage_secret}"
'''

# ============================================================
# TENANT OPS — observability (logs + DB-row inspection).
# Wraps `attesto webhook:list-events` / `webhook:list-deliveries` /
# `audit:list` (see app/cli/admin.ts) so operators don't have to type the
# fly-ssh-console incantation. JSON-per-line output piped to jq pairs nicely.
# ============================================================

[tasks."t:logs"]
description = "Tail recent logs filtered by tenant ID (use --follow to stream live)"
usage = '''
arg "tenant_id" help="Tenant ID (tenant_01HXY...)"
flag "--target <env>" help="staging or prod (default: staging)"
flag "--lines <n>" help="Lines of recent log buffer to scan (default: 200)"
flag "--follow" help="Stream live logs and filter by tenant (Ctrl-C to exit)"
'''
run = '''
TARGET="${usage_target:-staging}"
case "$TARGET" in
  staging) APP="attesto-staging" ;;
  prod) APP="attesto" ;;
  *) echo "error: --target must be 'staging' or 'prod' (got '$TARGET')" >&2; exit 2 ;;
esac

if [ "${usage_follow:-false}" = "true" ]; then
  if [ -n "${usage_lines:-}" ]; then
    echo "warning: --lines is ignored under --follow (live tail has no fixed buffer)" >&2
  fi
  echo "streaming live logs for ${usage_tenant_id} on ${APP} — Ctrl-C to exit" >&2
  exec fly logs -a "$APP" | grep --line-buffered -F "${usage_tenant_id}"
fi

OUT="$(fly logs -a "$APP" --no-tail | grep -F "${usage_tenant_id}" | tail -n "${usage_lines:-200}" || true)"
if [ -z "$OUT" ]; then
  cat >&2 <<EOF
no log lines for ${usage_tenant_id} in Fly's recent buffer (typically ~100 lines, mostly platform events).

This usually means either (a) no traffic for this tenant in the last few seconds,
or (b) the tenant ID isn't logged inline at the level you expect.

Try one of:
  mise run t:logs ${usage_tenant_id} --follow         # stream live, filter as events arrive
  mise run t:wh:events ${usage_tenant_id}             # list webhook_events rows
  mise run t:wh:deliveries ${usage_tenant_id}         # list webhook_deliveries rows
  mise run t:audit ${usage_tenant_id}                 # list audit_log rows
EOF
  exit 1
fi
printf '%s\n' "$OUT"
'''

[tasks."t:wh:events"]
description = "List recent webhook_events for a tenant (most recent first; subject extracted)"
usage = '''
arg "tenant_id" help="Tenant ID (tenant_01HXY...)"
flag "--limit <n>" help="Row limit (default: 20, max: 500)"
flag "--target <env>" help="staging or prod (default: staging)"
'''
run = '''
ARGS=("${usage_tenant_id}")
[ -n "${usage_limit:-}" ] && ARGS+=(--limit "${usage_limit}")
scripts/fly-attesto.sh "${usage_target:-staging}" webhook:list-events "${ARGS[@]}"
'''

[tasks."t:wh:deliveries"]
description = "List recent webhook_deliveries for a tenant — status, response code, retry state"
usage = '''
arg "tenant_id" help="Tenant ID (tenant_01HXY...)"
flag "--limit <n>" help="Row limit (default: 10, max: 500)"
flag "--target <env>" help="staging or prod (default: staging)"
'''
run = '''
ARGS=("${usage_tenant_id}")
[ -n "${usage_limit:-}" ] && ARGS+=(--limit "${usage_limit}")
scripts/fly-attesto.sh "${usage_target:-staging}" webhook:list-deliveries "${ARGS[@]}"
'''

[tasks."t:audit"]
description = "List recent validation_audit rows for a tenant (only populated when ENABLE_VALIDATION_AUDIT_LOG=true)"
usage = '''
arg "tenant_id" help="Tenant ID (tenant_01HXY...)"
flag "--limit <n>" help="Row limit (default: 20, max: 500)"
flag "--target <env>" help="staging or prod (default: staging)"
'''
run = '''
ARGS=("${usage_tenant_id}")
[ -n "${usage_limit:-}" ] && ARGS+=(--limit "${usage_limit}")
scripts/fly-attesto.sh "${usage_target:-staging}" audit:list "${ARGS[@]}"
'''

[tasks."apple:test-notification"]
description = "Local diagnostic — ask Apple to dispatch a synthetic V2 webhook (no DB)"
usage = '''
flag "--key-path <path>" help="Path to AuthKey_<KEY_ID>.p8"
flag "--key-id <id>" help="Apple Key ID (10-char alphanumeric)"
flag "--issuer-id <uuid>" help="App Store Connect Issuer ID"
flag "--bundle-id <id>" help="App bundle ID (com.example.app)"
flag "--env <env>" help="sandbox or production (default: sandbox)"
'''
run = '''
deno run --allow-net --allow-read scripts/apple-test-notification.ts \
  --key-path "${usage_key_path:-}" \
  --key-id "${usage_key_id:-}" \
  --issuer-id "${usage_issuer_id:-}" \
  --bundle-id "${usage_bundle_id:-}" \
  --env "${usage_env:-sandbox}"
'''

# ============================================================
# DOCS SITE (VitePress, lives in docs/)
# ============================================================
# `cd docs &&` lets the user run from repo root. pnpm fast-skips installs
# when node_modules is already current via the lockfile.

[tasks."docs:install"]
description = "Install VitePress dependencies in docs/"
run = "cd docs && pnpm install"

[tasks."docs:dev"]
description = "Run docs site locally on :5174"
depends = ["docs:install"]
run = "cd docs && pnpm dev"

[tasks."docs:build"]
description = "Build docs site to docs/.vitepress/dist"
depends = ["docs:install"]
run = "cd docs && pnpm build"

[tasks."docs:preview"]
description = "Preview the built docs site on :4174"
depends = ["docs:build"]
run = "cd docs && pnpm preview"

# ============================================================
# RELEASE / DEPLOY
# ============================================================
# `mise run deploy 0.0.2` tags v0.0.2 and pushes — GitHub Actions
# handles the rest (docker.yml builds, deploy.yml deploys staging
# then pauses for prod approval).
#
# Gates (preventing the most common footguns):
#   - arg must be semver `N.N.N` or `N.N.N-<label>` (no leading `v`)
#   - working tree must be clean (no uncommitted work)
#   - must be on `main` (feature branches don't deploy)
#   - local main must be up to date with origin/main
#   - the tag must not already exist locally or on origin

[tasks.deploy]
description = "Tag and push vX.Y.Z to trigger CI deploy (e.g. `mise run deploy 0.0.2`)"
usage = '''
arg "version" help="Semver version WITHOUT the leading v (e.g. 0.0.2, 0.1.0-rc.1)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

VERSION="${usage_version:-${1:-}}"
if [[ -z "$VERSION" ]]; then
  echo "usage: mise run deploy <version>   (e.g. mise run deploy 0.0.2)" >&2
  exit 2
fi
if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
  echo "error: '$VERSION' is not a semver (expected N.N.N or N.N.N-<label>, no leading v)" >&2
  exit 2
fi
TAG="v$VERSION"

# Clean tree
if ! git diff --quiet || ! git diff --cached --quiet; then
  echo "error: working tree has uncommitted changes — commit or stash first" >&2
  git status --short >&2
  exit 1
fi

# On main
BRANCH="$(git branch --show-current)"
if [[ "$BRANCH" != "main" ]]; then
  echo "error: must be on main, currently on '$BRANCH'" >&2
  exit 1
fi

# Local main matches origin/main
git fetch --quiet origin main
LOCAL="$(git rev-parse @)"
REMOTE="$(git rev-parse @{u})"
if [[ "$LOCAL" != "$REMOTE" ]]; then
  echo "error: local main diverges from origin/main — pull/push first" >&2
  echo "  local:  $LOCAL" >&2
  echo "  remote: $REMOTE" >&2
  exit 1
fi

# Tag doesn't already exist
if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
  echo "error: tag $TAG already exists locally — bump the version" >&2
  exit 1
fi
if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
  echo "error: tag $TAG already exists on origin — bump the version" >&2
  exit 1
fi

echo "→ tagging $TAG on $(git rev-parse --short HEAD) ($(git log -1 --format=%s))"
git tag -a "$TAG" -m "Release $TAG"
git push origin "$TAG"

echo ""
echo "✓ pushed $TAG"
echo "  Watch: https://github.com/nossdev/attesto/actions"
echo "  Staging will deploy automatically; production pauses for approval."
'''
