# Fly.io config for production — `attesto` in the `iad` region.
# Staging lives in `fly.staging.toml`. Generated by `fly launch` on
# 2026-04-25, then annotated with the original rationale from PLAN.md §9.
#
# Region rationale: `iad` (Ashburn, VA) is Fly's best-connected region —
# direct peering with Apple/Google/AWS/GitHub, lowest average latency to
# North American tenant backends. PLAN.md §9 originally called for `sin`
# based on operator proximity, but Attesto's p99 is dominated by outbound
# Apple/Google API calls, not tenant→Attesto RTT, so operator location is
# not the right optimization target. When tenant geography diversifies,
# add regions via `fly regions add <code>` (compute goes multi-region;
# Postgres primary stays here).
#
# Secrets (ATTESTO_ENCRYPTION_KEY, DATABASE_URL from `fly postgres attach`)
# are set via `fly secrets set ... --app attesto`. Non-secret env lives
# in [env] below.
#
# See https://fly.io/docs/reference/configuration/ for syntax details.
# Re-read PLAN.md §9 before changing concurrency/scale settings.

app = 'attesto'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  # Run pending Drizzle migrations BEFORE the app starts handling traffic.
  # `attesto migrate` is idempotent.
  release_command = '/usr/local/bin/attesto migrate'

[env]
  # Feature flag — flip to `'true'` via `fly secrets set` if you want
  # every /v1/*/verify call logged to validation_audit. Table grows
  # unbounded; configure a retention job before leaving this on.
  ENABLE_VALIDATION_AUDIT_LOG = 'false'
  LOG_LEVEL = 'info'
  NODE_ENV = 'production'
  PORT = '8080'
  # Rate limit defaults — override via `fly secrets set` if a tenant needs
  # more headroom, or to tighten if we see abuse. Values are per-process;
  # with N Fly machines, effective cap is N × these numbers.
  RATE_LIMIT_BURST = '200'
  RATE_LIMIT_PER_SECOND = '100'

[http_service]
  internal_port = 8080
  force_https = true
  # Scale-to-zero on idle, but keep one machine warm so cold-start doesn't
  # cost webhook reliability (Apple/Google retry on timeout but it's
  # better to avoid the retry at all).
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 100

  [[http_service.checks]]
    # Liveness: cheap — doesn't touch DB. Short interval is fine.
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

  [[http_service.checks]]
    # Readiness: deeper — verifies DB reachability + decryption key works.
    # Longer interval because it hits the DB; longer grace for migrations.
    interval = '1m0s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/ready'
    protocol = 'http'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
