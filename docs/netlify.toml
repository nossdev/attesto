# Netlify build config for the Attesto documentation site.
#
# This file is at docs/netlify.toml so Netlify auto-discovers it when the
# repo's `base` directory is set to `docs`. The CI workflow at
# .github/workflows/docs.yml does the publishing — Netlify itself doesn't
# pull from the repo. This file is read by the Netlify CLI used in CI to
# determine where the publish dir is.

[build]
  base    = "docs"
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = ".vitepress/dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"

# Friendly-URL aliases — let visitors type the obvious thing and land on
# the right page. Add more as the docs grow.
[[redirects]]
  from = "/api"
  to = "/reference/api"
  status = 301

[[redirects]]
  from = "/errors"
  to = "/reference/error-codes"
  status = 301

[[redirects]]
  from = "/setup"
  to = "/self-host/quickstart"
  status = 301

[[redirects]]
  from = "/install"
  to = "/self-host/quickstart"
  status = 301

# Service-first restructure (2026-04): operator pages moved from
# /guide/<page> to /self-host/<page>. The /guide/quickstart URL is
# DELIBERATELY NOT redirected — it now serves the new integrator
# quickstart, which is a strict improvement over redirecting to
# similar-but-different content.
[[redirects]]
  from = "/guide/onboarding"
  to = "/self-host/onboarding"
  status = 301

[[redirects]]
  from = "/guide/apple-setup"
  to = "/self-host/apple-setup"
  status = 301

[[redirects]]
  from = "/guide/google-setup"
  to = "/self-host/google-setup"
  status = 301

[[redirects]]
  from = "/guide/tenants"
  to = "/self-host/tenants"
  status = 301

[[redirects]]
  from = "/guide/deployment"
  to = "/self-host/deployment"
  status = 301

[[redirects]]
  from = "/guide/operations"
  to = "/self-host/operations"
  status = 301

[[redirects]]
  from = "/guide/maintenance"
  to = "/self-host/maintenance"
  status = 301

[[redirects]]
  from = "/guide/testing"
  to = "/self-host/testing"
  status = 301

[[redirects]]
  from = "/guide/load-testing"
  to = "/self-host/load-testing"
  status = 301

[[redirects]]
  from = "/guide/troubleshooting"
  to = "/self-host/troubleshooting"
  status = 301

# /guide/webhooks split into reference (delivery format) + recipes
# (per-language receiver implementations) + self-host/webhooks
# (operator-side: registering Apple S2S / Google Pub/Sub URLs).
[[redirects]]
  from = "/guide/webhooks"
  to = "/reference/webhooks"
  status = 301

# Cache static assets aggressively when their URL is content-hashed;
# HTML pages are short-cache so updates propagate within a deploy cycle.
#
# IMPORTANT: only `/assets/*` is content-hashed by VitePress (filenames
# like `app-abc123.js` change whenever the content changes). Stable-URL
# files in `public/` — favicon, logos, icons — keep the SAME path
# across deploys, so they MUST NOT be `immutable`. Falling back to
# Netlify's default caching for them gives ETag-based revalidation,
# which means logo updates propagate within minutes, not a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
