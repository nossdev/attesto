name: Docker — build + push to GHCR

# On every `v*` tag (e.g. v0.1.0, v0.1.0-rc.1), build a multi-arch image
# and push to ghcr.io/nossdev/attesto:<tag> and :latest.
#
# The image is the same one Fly deploys — we don't use it from deploy.yml
# (which rebuilds from the Dockerfile directly via `fly deploy`). This
# exists so self-hosters can `docker pull ghcr.io/nossdev/attesto:v0.1.0`
# without re-building.
#
# Architecture strategy: matrix per-arch on NATIVE runners, no QEMU.
# We previously emulated arm64 on amd64 via QEMU and `deno compile` failed
# intermittently with SIGILL (V8 JIT codegen issue under emulation, not a
# code bug). Switching to GitHub's native arm64 runner (`ubuntu-24.04-arm`)
# sidesteps that entirely. arm64 runners are free for public repos per
# GitHub's pricing.

on:
  push:
    tags:
      - "v*"
  # Manual trigger for out-of-band rebuilds.
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  # ─── Per-arch build + push ─────────────────────────────────────────────
  # Each leg builds and pushes a single-platform image tagged with an
  # architecture-suffixed digest. The manifest job downstream joins them
  # into a multi-arch index under the canonical tags.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    outputs:
      digest-amd64: ${{ steps.export.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.export.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nossdev/attesto
          # Per-arch images push by digest only — the manifest job below
          # joins them under the canonical tags. No `tags:` block here on
          # purpose: we don't want the per-arch builds to overwrite each
          # other under shared tags.
          labels: |
            org.opencontainers.image.source=https://github.com/nossdev/attesto
            org.opencontainers.image.licenses=MIT

      - id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # `outputs: type=image,push-by-digest=true,name=...` produces a
          # manifest digest that the next job can reference, without ever
          # creating a tag. The downstream `docker buildx imagetools` call
          # joins the digests into a multi-arch index under the real tags.
          outputs: type=image,name=ghcr.io/nossdev/attesto,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - id: export
        name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "$digest" > /tmp/digests/${{ matrix.arch }}
          echo "digest-${{ matrix.arch }}=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  # ─── Manifest join ─────────────────────────────────────────────────────
  # Combines the per-arch digests into a single multi-arch image and tags
  # it with all the canonical tags (semver, latest, etc.).
  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nossdev/attesto
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # Collect both digests; build a buildx imagetools create command that
          # joins them under every canonical tag from metadata-action.
          tags=$(jq -cr '.tags | map("--tag " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          digests=$(printf 'ghcr.io/nossdev/attesto@%s ' $(cat amd64 arm64))
          docker buildx imagetools create $tags $digests

      - name: Inspect
        run: |
          tag=$(jq -r '.tags[0]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$tag"

      # ─── Notification: image build success ─────────────────────────────
      # Fires only on `v*` tag pushes. Self-hosters can
      # `docker pull ghcr.io/nossdev/attesto:<version>` once this lands.
      - name: Discord — image published
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "Image published ${{ github.ref_name }}"
          description: |
            Multi-arch image (linux/amd64 + linux/arm64) is live on GHCR.

            Self-hosters can pull with:
            ```
            docker pull ghcr.io/nossdev/attesto:${{ github.ref_name }}
            ```
          version: ${{ github.ref_name }}
          extra_fields: |
            [
              { "name": "Registry", "value": "[ghcr.io/nossdev/attesto](https://github.com/nossdev/attesto/pkgs/container/attesto)", "inline": false }
            ]

      # ─── Notification: image build failure ─────────────────────────────
      # A failure here means deploy.yml will silently never see the image —
      # but since we use `flyctl deploy --remote-only` (Fly rebuilds from
      # Dockerfile, not from GHCR), the Fly deploy can still proceed. The
      # missing artifact only affects self-hosters. Notify but don't panic.
      - name: Discord — image build failed
        if: failure() && startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "Image build FAILED ${{ github.ref_name }}"
          description: |
            GHCR image for `${{ github.ref_name }}` did not publish. Fly deploy is unaffected
            (Fly rebuilds from the Dockerfile directly), but self-hosters won't be able to
            `docker pull` this version until rebuilt.
          version: ${{ github.ref_name }}
