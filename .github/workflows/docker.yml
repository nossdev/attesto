name: Docker — build + push to GHCR

# On every `v*` tag (e.g. v0.1.0, v0.1.0-rc.1), build a multi-arch image
# and push to ghcr.io/nossdev/attesto:<tag> and :latest.
#
# The image is the same one Fly deploys — we don't use it from deploy.yml
# (which rebuilds from the Dockerfile directly via `fly deploy`). This
# exists so self-hosters can `docker pull ghcr.io/nossdev/attesto:v0.1.0`
# without re-building.

on:
  push:
    tags:
      - "v*"
  # Manual trigger for out-of-band rebuilds.
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU emulation kept here so we CAN add arm64 back later (likely via a
      # native arm64 GitHub-hosted runner — see notes on `platforms` below).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nossdev/attesto
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
          labels: |
            org.opencontainers.image.source=https://github.com/nossdev/attesto
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # amd64 only for now. linux/arm64 was failing intermittently with
          # SIGILL (exit 132) at the `deno compile` step under QEMU emulation
          # — known fragility in the Deno+QEMU stack, not a code issue
          # (amd64 builds the same source successfully). Fly.io deploys use
          # amd64 shared machines so production is unaffected. To restore
          # arm64 cleanly: split into two jobs in a matrix, with the arm64
          # job pinned to a native `ubuntu-22.04-arm` (or equivalent) runner
          # rather than emulating via QEMU. Until then, self-hosters on ARM
          # can build locally from the Dockerfile.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── Notification: image build success ─────────────────────────────
      # Fires only on `v*` tag pushes (workflow trigger). Self-hosters can
      # `docker pull ghcr.io/nossdev/attesto:<version>` once this lands.
      - name: Discord — image published
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "Image published ${{ github.ref_name }}"
          description: |
            amd64 image is live on GHCR. (arm64 temporarily disabled — see
            docker.yml comment; restore via native arm64 runners.)

            Self-hosters can pull with:
            ```
            docker pull ghcr.io/nossdev/attesto:${{ github.ref_name }}
            ```
          version: ${{ github.ref_name }}
          extra_fields: |
            [
              { "name": "Registry", "value": "[ghcr.io/nossdev/attesto](https://github.com/nossdev/attesto/pkgs/container/attesto)", "inline": false }
            ]

      # ─── Notification: image build failure ─────────────────────────────
      # A failure here means deploy.yml will silently never see the image —
      # but since we use `flyctl deploy --remote-only` (Fly rebuilds from
      # Dockerfile, not from GHCR), the Fly deploy can still proceed. The
      # missing artifact only affects self-hosters. Notify but don't panic.
      - name: Discord — image build failed
        if: failure() && startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "Image build FAILED ${{ github.ref_name }}"
          description: |
            GHCR image for `${{ github.ref_name }}` did not publish. Fly deploy is unaffected
            (Fly rebuilds from the Dockerfile directly), but self-hosters won't be able to
            `docker pull` this version until rebuilt.
          version: ${{ github.ref_name }}
