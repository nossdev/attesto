name: Docker — build + push to GHCR

# On every `v*` tag (e.g. v0.1.0, v0.1.0-rc.1), build a multi-arch image
# and push to ghcr.io/nossdev/attesto:<tag> and :latest.
#
# The image is the same one Fly deploys — we don't use it from deploy.yml
# (which rebuilds from the Dockerfile directly via `fly deploy`). This
# exists so self-hosters can `docker pull ghcr.io/nossdev/attesto:v0.1.0`
# without re-building.

on:
  push:
    tags:
      - "v*"
  # Manual trigger for out-of-band rebuilds.
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nossdev/attesto
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
          labels: |
            org.opencontainers.image.source=https://github.com/nossdev/attesto
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
